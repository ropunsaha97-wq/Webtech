<html>
  <head>
    <link rel="stylesheet" href="Task.css" />
    <script src="Task.js"></script>
  </head>
  <body>
    <div class="container">
      <fieldset>
        <legend>Student Registration</legend>
        <form onsubmit="return registerStudent();">
          <table>
            <tr>
              <td><label>First Name <span class="required">*</span></label></td>
              <td><input type="text" id="firstName" /></td>
              <td><p id="firstNameError" style="color: red"></p></td>
            </tr>
            <tr>
              <td><label>Last Name <span class="required">*</span></label></td>
              <td><input type="text" id="lastName" /></td>
              <td><p id="lastNameError" style="color: red"></p></td>
            </tr>
            <tr>
              <td><label>Student ID <span class="required">*</span></label></td>
              <td><input type="text" id="studentId" /></td>
              <td><p id="studentIdError" style="color: red"></p></td>
            </tr>
            <tr>
              <td><label>Email <span class="required">*</span></label></td>
              <td><input type="text" id="email" /></td>
              <td><p id="emailError" style="color: red"></p></td>
            </tr>
            <tr>
              <td><label>Credit Completed <span class="required">*</span></label></td>
              <td><input type="text" id="creditCompleted" /></td>
              <td><p id="creditCompletedError" style="color: red"></p></td>
            </tr>
            <tr>
              <td><label>Department <span class="required">*</span></label></td>
              <td>
                <select id="department">
                  <option value="">Select</option>
                  <option value="CSC">CSC</option>
                  <option value="EEE">EEE</option>
                  <option value="BBA">BBA</option>
                  <option value="ENG">ENG</option>
                </select>
              </td>
              <td><p id="departmentError" style="color: red"></p></td>
            </tr>
          </table>
          <div class="btnWrap">
            <button>Register</button>
          </div>
        </form>
      </fieldset>

      <fieldset>
        <legend>Registered Students</legend>
        <table id="studentTable">
          <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Student ID</th>
            <th>Email</th>
            <th>Credit Completed</th>
            <th>Department</th>
          </tr>
        </table>
      </fieldset>
    </div>
  </body>
</html>
