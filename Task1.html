<!DOCTYPE html>
<html>
<head>
  
  <title>Pental Shop - Inventory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    h1 {
      text-align: center;
    }

    p {
      margin-bottom: 20px;
    }

    table {
      width: 60%;
      border-collapse: collapse;
    }

    th {
      background-color: #2c6e6e;
      color: white;
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 10px;
      border: 1px solid #999;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <h1>Welcome to Pental Shop</h1>

  <table>
    <tr>
      <th>Item Name</th>
      <th>Quantity</th>
      <th>Status</th>
    </tr>
    <tr>
      <td>Pencils</td>
      <td>100</td>
      <td>In Stock</td>
    </tr>
    <tr>
      <td>Notebooks</td>
      <td>50</td>
      <td>Low Stock</td>
    </tr>
    <tr>
      <td>Markers</td>
      <td>15</td>
      <td>In Stock</td>
    </tr>
  </table>

</body>
</html>
